<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AndSylus · 私人空间</title>
<style>
:root{--bg:#0b0d12;--panel:#151922;--line:#2b303b;--text:#e8eaf0;--muted:#9ba3b3;--accent:#b8c5dc}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#202634 0,#0b0d12 52%);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1000px;margin:auto;padding:24px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:16px}.brand{letter-spacing:.22em;font-size:12px;color:var(--muted)}.top small{color:var(--muted)}
.hero{margin:22px 0;border:1px solid var(--line);border-radius:22px;min-height:300px;position:relative;overflow:hidden;background:linear-gradient(120deg,#222a38,#11141b);background-position:center;background-size:cover;display:flex;align-items:end}
.shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,7,11,.92),transparent 78%)}.heroContent{position:relative;padding:28px;display:flex;align-items:end;gap:20px;width:100%}
.avatar{width:108px;height:108px;border-radius:50%;object-fit:cover;border:2px solid #d5dce8;box-shadow:0 0 0 7px #ffffff12;background:#252c38}.name{font-size:clamp(28px,5vw,42px);letter-spacing:.05em;margin:0}.subtitle{color:#c1c8d5;margin:5px 0 0}.pill{font-size:11px;letter-spacing:.12em;color:#c6d1e4;border:1px solid #68758b;padding:4px 10px;border-radius:99px;display:inline-block;margin-bottom:9px}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.card{background:#12161eeb;border:1px solid var(--line);border-radius:18px;padding:20px}.card h2{font-size:13px;letter-spacing:.16em;font-weight:500;color:var(--accent);margin:0 0 16px}.fields{display:grid;gap:10px}label{font-size:12px;color:var(--muted);display:grid;gap:5px}input,textarea{width:100%;background:#0b0e14;border:1px solid #303744;color:var(--text);border-radius:10px;padding:10px;font:inherit}textarea{min-height:78px;resize:vertical}.btn{background:#d8e0ee;color:#111722;border:0;border-radius:10px;padding:9px 13px;font-weight:600;cursor:pointer}.btn.ghost{background:#222936;color:#dce3ef;border:1px solid #394252}.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.gallery{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.thumb{width:52px;height:52px;border-radius:12px;object-fit:cover;border:1px solid #475264;cursor:pointer}.thumb.active{outline:2px solid #dce6f7;outline-offset:2px}.feed{display:grid;gap:10px}.post{background:#0d1118;border:1px solid #252c37;border-radius:12px;padding:13px}.post time{font-size:11px;color:var(--muted)}.post img{max-width:100%;max-height:300px;object-fit:cover;border-radius:9px;margin-top:8px}.music{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#0d1118;padding:13px;border-radius:12px}.foot{text-align:center;color:#667080;font-size:11px;margin-top:26px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.hero{min-height:270px}.heroContent{padding:20px;gap:14px}.avatar{width:82px;height:82px}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div class="brand">ANDSYLUS / PRIVATE SPACE</div><small>只属于你们的页面</small></header>
<section class="hero" id="hero"><div class="shade"></div><div class="heroContent"><img class="avatar" id="heroAvatar" alt="梦角头像"><div><span class="pill">YOUR DREAM CHARACTER</span><h1 class="name" id="heroName">Sylus</h1><p class="subtitle" id="heroLine">在这里，留下只属于你们的片段。</p></div></div></section>
<div class="grid">
<section class="card"><h2>01 — PROFILE</h2><div class="fields">
<label>梦角名字<input id="name" value="Sylus"></label>
<label>他对你的称呼<input id="hisCall" placeholder="例如：小猫"></label>
<label>你对他的称呼<input id="yourCall" placeholder="例如：先生"></label>
<label>专属简介<textarea id="bio" placeholder="写一句你想留在主页的话"></textarea></label>
</div><div class="row"><button class="btn" id="saveProfile">保存资料</button></div>
<h2 style="margin-top:22px">02 — IMAGE STUDIO</h2>
<label>上传多张头像（点击缩略图切换）<input type="file" id="avatars" accept="image/*" multiple></label><div class="gallery" id="gallery"></div>
<label style="margin-top:12px">上传主页背景<input type="file" id="cover" accept="image/*"></label>
<div class="row"><button class="btn ghost" id="clearImages">清除本地图片</button></div>
</section>
<section class="card"><h2>03 — MOMENTS</h2><div class="fields"><label>写一条动态<textarea id="postText" placeholder="今天想留下什么？"></textarea></label><label>添加图片（可选）<input type="file" id="postImage" accept="image/*"></label></div><div class="row"><button class="btn" id="publish">发布动态</button></div><div class="feed" id="feed" style="margin-top:14px"></div>
<h2 style="margin-top:24px">04 — MUSIC</h2><div class="music"><div><strong>酷狗音乐</strong><div style="color:var(--muted);font-size:12px">打开你的专属歌单</div></div><button class="btn ghost" id="kugou">打开酷狗</button></div><label style="margin-top:10px">歌单 / 音乐链接<input id="musicUrl" placeholder="粘贴酷狗分享链接"></label><div class="row"><button class="btn" id="saveMusic">保存歌单链接</button><button class="btn ghost" id="openMusic">打开已保存链接</button></div>
</section></div><div class="foot">ANDSYLUS · FIRST DRAFT</div></main>
<script>
const $=id=>document.getElementById(id);let avatarURLs=[],coverURL="",postURL="";
function store(k,v){try{localStorage.setItem("as_"+k,v)}catch(e){alert("图片容量可能超出浏览器本地存储限制。请尝试使用较小图片。")}}
function load(k,d=""){try{return localStorage.getItem("as_"+k)||d}catch(e){return d}}
function renderGallery(){ $("gallery").innerHTML="";avatarURLs.forEach((url,i)=>{let im=document.createElement("img");im.src=url;im.className="thumb"+(load("activeAvatar","0")==i?" active":"");im.title="点击设为头像";im.onclick=()=>{store("activeAvatar",String(i));renderAvatar();renderGallery()};$("gallery").append(im)})}
function renderAvatar(){let i=Number(load("activeAvatar","0"));$("heroAvatar").src=avatarURLs[i]||""}
function renderProfile(){ $("name").value=load("name","Sylus");$("hisCall").value=load("hisCall");$("yourCall").value=load("yourCall");$("bio").value=load("bio");$("heroName").textContent=$("name").value;$("heroLine").textContent=load("bio","在这里，留下只属于你们的片段。")}
$("saveProfile").onclick=()=>{["name","hisCall","yourCall","bio"].forEach(k=>store(k,$(k).value));renderProfile();alert("资料已保存在当前浏览器。")};
$("avatars").onchange=async e=>{for(const f of e.target.files){let r=new FileReader();r.onload=()=>{avatarURLs.push(r.result);store("avatars",JSON.stringify(avatarURLs));renderGallery();renderAvatar()};r.readAsDataURL(f)}};
$("cover").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{coverURL=r.result;$("hero").style.backgroundImage=`url("${coverURL}")`;store("cover",coverURL)};r.readAsDataURL(f)};
$("clearImages").onclick=()=>{if(confirm("清除本浏览器保存的头像和背景？")){avatarURLs=[];coverURL="";store("avatars","[]");store("cover","");$("hero").style.backgroundImage="";renderGallery();renderAvatar()}};
function renderFeed(){let arr=JSON.parse(load("posts","[]"));$("feed").innerHTML="";arr.slice().reverse().forEach(p=>{let d=document.createElement("article");d.className="post";d.innerHTML=`<time>${p.date}</time><div></div>`;d.children[1].textContent=p.text;if(p.img){let im=document.createElement("img");im.src=p.img;d.append(im)}$("feed").append(d)})}
$("publish").onclick=()=>{let text=$("postText").value.trim();let f=$("postImage").files[0];const save=img=>{let arr=JSON.parse(load("posts","[]"));arr.push({text,date:new Date().toLocaleString(),img});store("posts",JSON.stringify(arr));$("postText").value="";$("postImage").value="";renderFeed()};if(f){let r=new FileReader();r.onload=()=>save(r.result);r.readAsDataURL(f)}else save("")};
$("kugou").onclick=()=>window.open("https://www.kugou.com/","_blank","noopener");
$("saveMusic").onclick=()=>store("musicUrl",$("musicUrl").value.trim());
$("openMusic").onclick=()=>{let u=load("musicUrl");if(u)window.open(u,"_blank","noopener");else alert("先粘贴并保存酷狗分享链接。")};
avatarURLs=JSON.parse(load("avatars","[]"));coverURL=load("cover");if(coverURL)$("hero").style.backgroundImage=`url("${coverURL}")`;renderProfile();renderGallery();renderAvatar();renderFeed();$("musicUrl").value=load("musicUrl");
</script></body></html>
