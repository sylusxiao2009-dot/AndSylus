async function vput(f){const d=await idb(),t=d.transaction("voices","readwrite"),q=t.objectStore("voices").add({b:f}),id=await new Promise(ok=>q.onsuccess=()=>ok(q.result));await new Promise(ok=>t.oncomplete=ok);return id}
async function vget(id){const d=await idb();return new Promise(ok=>{const q=d.transaction("voices").objectStore("voices").get(id);q.onsuccess=()=>ok(q.result&&q.result.b);q.onerror=()=>ok(null)})}
async function vdel(id){try{const d=await idb();d.transaction("voices","readwrite").objectStore("voices").delete(id)}catch(e){}}
const vdur=f=>new Promise(ok=>{const a=new Audio(),u=URL.createObjectURL(f);a.preload="metadata";a.onloadedmetadata=()=>{URL.revokeObjectURL(u);ok(Math.max(1,Math.round(a.duration)||1))};a.onerror=()=>{URL.revokeObjectURL(u);ok(1)};a.src=u});
const VA=new Audio();let vid=0,vu="";
async function vplay(id){if(vid===id&&!VA.paused){VA.pause();return}const b=await vget(id);if(!b){toast("语音文件找不到了");return}AU.pause();if(vu)URL.revokeObjectURL(vu);vu=URL.createObjectURL(b);VA.src=vu;vid=id;VA.play().catch(()=>toast("无法播放这个文件"))}
function vimp(){const i=document.createElement("input");i.type="file";i.accept="audio/*";i.multiple=true;i.onchange=async()=>{let n=0;for(const f of i.files){try{const id=await vput(f),d=await vdur(f);S.cards.push({t:f.name.replace(/\.[^.]+$/,"").replace(/[<>"']/g,"")||"语音",c:fc||"默认",a:id,d});n++}catch(e){}}save();drawLib();toast(`导入 ${n} 条语音`)};i.click()}
function vpick(k){const i=document.createElement("input");i.type="file";i.accept="audio/*";i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const c=S.cards[k],id=await vput(f),d=await vdur(f);if(c.a)await vdel(c.a);c.a=id;c.d=d;save();drawLib()}catch(e){toast("保存失败")}};i.click()}
async function vrm(k){const c=S.cards[k];if(c.a)await vdel(c.a);delete c.a;delete c.d;save();drawLib()}
async function cdel(k){const c=S.cards[k];if(c&&c.a)await vdel(c.a);S.cards.splice(k,1);save();drawLib()}
