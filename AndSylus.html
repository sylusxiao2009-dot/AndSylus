const ic=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const D={cards:["别站那么近。我不习惯有人看着我","还不睡？","我在","你今天说的话，我都记着","不用急着回答","有些事，晚上才看得清楚","手给我","别逞强，累了就说","嗯，听见了","你比我想的更固执","过来，坐这里","雨停了，要不要出去走走","下次别让我等太久","这个问题，我需要想一想","你笑起来的时候，很安静","好奇怪，我竟然在等你的消息","先把外套穿上","我没有生气，只是在意","今晚的月亮不错","说吧，我听着"],

chat:[],mom:[],mail:[],diary:[],me:{n:"Xioa",id:"xioa",a:""},sy:{n:"Sylus",id:"sylus",a:""},cover:"",wall:"",bub:{c1:"",c2:"",r:20,fs:16,op:100}};
let S=load(),cur="home";
function load(){try{const j=JSON.parse(localStorage.getItem("andsylus")||"null");if(!j)return structuredClone(D);return{...structuredClone(D),...j,set:{...D.set,...j.set},lex:{...D.lex,...j.lex},bub:{...D.bub,...j.bub},me:{...D.me,...j.me},sy:{...D.sy,...j.sy}}}catch(e){return structuredClone(D)}}
function save(){try{localStorage.setItem("andsylus",JSON.stringify(S))}catch(e){toast("存储空间不足")}}
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),1600)}
const L=k=>S.lex[k].split(/\s+/).filter(Boolean),tm=t=>new Date(t).toLocaleTimeString("zh-CN",{hour12:false}),dk=()=>new Date().toLocaleDateString("zh-CN",{month:"long",day:"numeric"});
const cnt=()=>{const a=+S.set.min,b=Math.max(a,+S.set.max);return S.set.free?a+(Math.random()*(b-a+1)|0):1};
function gen(n){if(!S.cards.length)return"……";const no=P(S.set.pOff),pu=L("punct"),a=[];
 for(let i=0;i<n;i++){let t=R(S.cards);if(S.set.free&&P(S.set.frag)){const f=t.split(/[，。！？、,.!?…；;\s]+/).filter(Boolean);if(f.length)t=R(f)}
  t=t.replace(/[，。！？、,.!?…；;\s]+$/,"");a.push(no||!pu.length||!P(S.set.pOn)?t:t+R(pu))}
 return a.join("")}
function av(w,s){const u=S[w];return u.a?`<img class="av" style="width:${s}px;height:${s}px" src="${u.a}" alt="">`:`<span class="av" style="width:${s}px;height:${s}px;font-size:${s/2.4}px">${esc(u.n[0]||"?")}</span>`}
function pick(cb,w=720){const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=()=>{const f=i.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,w/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.8))};im.src=fr.result};fr.readAsDataURL(f)};i.click()}
const hd=(t,r="",b="home")=>`<div class="top"><button class="rb" aria-label="返回" onclick="go('${b}')">${ic("back")}</button><b class="tt1">${t}</b>${r}</div>`;
function sty(){const s=document.documentElement.style,b=S.bub;b.c1?s.setProperty("--b1",b.c1):s.removeProperty("--b1");b.c2?s.setProperty("--b2",b.c2):s.removeProperty("--b2");s.setProperty("--r",b.r+"px");s.setProperty("--fs",b.fs+"px");s.setProperty("--op",b.op+"%")}
function sv(g,k,v){S[g][k]=v;save();const e=$("#v"+k);if(e)e.textContent=v;sty()}
const rg=(g,k,l,a=0,b=100)=>`<div class="f"><label>${l}</label><span id="v${k}">${S[g][k]}</span><input type="range" min="${a}" max="${b}" value="${S[g][k]}" oninput="sv('${g}','${k}',+this.value)"></div>`;

const tx=(g,k,l)=>`<div class="f col"><label>${l}</label><input value="${esc(S[g][k])}" onchange="sv('${g}','${k}',this.value)"></div>`;

const V={};
V.home=()=>{const d=S.diary[0];return`<div class="home"><div class="duo"><div class="who">${av("sy",64)}<b>${esc(S.sy.n)}</b><small>@${esc(S.sy.id)}</small></div>${ic("heart")}<div class="who">${av("me",64)}<b>${esc(S.me.n)}</b><small>@${esc(S.me.id)}</small></div></div>
<div class="chip">${d?`今天${d.w}，在${d.p}，心情${d.m}`:""}</div>
<div class="grid">${[["chat","聊天"],["moments","朋友圈"],["lib","字卡库"],["mail","信箱"],["diary","日记"],["music","音乐"]].map(([k,n])=>`<button class="app" onclick="go('${k}')"><i>${ic(k)}</i>${n}</button>`).join("")}${[["phone","电话"],["group","群聊"],["quiz","问卷"],["face","表情包"]].map(([k,n])=>`<button class="app off" onclick="toast('这个页面还没做')"><i>${ic(k)}</i>${n}</button>`).join("")}</div></div>`};

function drawChat(){const el=$("#msgs");if(!el)return;el.innerHTML=S.chat.length?S.chat.map((m,i)=>{
 if(m.w==="sys")return`<div class="sys">${esc(m.t)}</div>`;const me=m.w==="me";
 if(m.rc)return`<div class="sys">${me?"你":esc(S.sy.n)}撤回了一条消息</div>`;
 return`<div class="row ${me?"r":"l"}">${av(m.w,40)}<div class="mw"><div class="bub ${m.w}">${esc(m.t)}${m.e?`<span class="em">${m.e}</span>`:""}</div><div class="meta">${tm(m.ts)}${me?`<a onclick="rc(${i})">撤回</a>`:""}${m.g?`<span class="tag">${esc(m.g)}</span>`:""}</div></div></div>`}).join(""):`<div class="empty">发一句话，他会从字卡里回你</div>`;el.scrollTop=el.scrollHeight}
function send(){const v=$("#inp").value.trim();if(!v)return;const m={w:"me",t:v,ts:Date.now()};if(P(S.set.emoji)&&L("emoji").length)m.e=R(L("emoji"));S.chat.push(m);$("#inp").value="";save();drawChat();

V.lib=()=>`${hd("字卡库")}<div class="pad"><div class="cnt" id="cn"></div><textarea id="nc" placeholder="新字卡，一行一张"></textarea><div class="acts"><button onclick="addCards()">添加</button><button onclick="imp()">导入 TXT / CSV / JSON</button><button onclick="vimp()">导入语音条</button></div><input id="q" placeholder="搜索字卡" oninput="drawLib()"><div id="ll"></div></div>`;
function drawLib(){if(!$("#ll"))return;const q=$("#q").value.trim(),a=[];S.cards.forEach((t,i)=>{if(!q||t.includes(q))a.push(i)});$("#cn").textContent=`共 ${S.cards.length} 张`+(q?`，匹配 ${a.length} 张`:"");$("#ll").innerHTML=(q&&a.length?`<button class="btn" onclick="delAll()">删除全部匹配</button>`:"")+a.slice(0,80).map(i=>`<div class="it"><span>${esc(S.cards[i])}</span><button aria-label="删除" onclick="cdel(${i})">${ic("trash")}</button>${vrow(S.cards[i],i)}</div>`).join("")}
